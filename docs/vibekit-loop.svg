<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#818cf8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#6ee7b7"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="580" rx="16" fill="url(#bg)"/>

  <!-- ═══════════ ROW 1: TITLE ═══════════ -->
  <text x="400" y="36" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.5">vibekit</text>
  <text x="400" y="56" text-anchor="middle" fill="#94a3b8" font-size="11">autonomous product development loop for Claude Code</text>

  <!-- ═══════════ ROW 2: SETUP (standalone, run-once) ═══════════ -->
  <rect x="280" y="78" width="240" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="400" y="100" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">/vb-setup</text>
  <text x="400" y="114" text-anchor="middle" fill="#64748b" font-size="9">run once — PRODUCT.md, CI, Kanban, labels, hooks</text>
  <rect x="286" y="82" width="50" height="14" rx="3" fill="#6366f1" opacity="0.15"/>
  <text x="311" y="92" text-anchor="middle" fill="#818cf8" font-size="7" font-weight="600">RUN ONCE</text>

  <!-- Arrow: setup → simulate -->
  <line x1="400" y1="122" x2="400" y2="148" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══════════ ROW 3: THE CORE LOOP ═══════════ -->
  <!-- Loop container -->
  <rect x="40" y="155" width="720" height="130" rx="12" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>
  <text x="60" y="173" fill="#818cf8" font-size="9" font-weight="600" opacity="0.7">CORE LOOP — repeat until clean</text>

  <!-- Simulate -->
  <rect x="60" y="185" width="200" height="80" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="160" y="210" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">/vb-simulate</text>
  <text x="160" y="226" text-anchor="middle" fill="#e2e8f0" font-size="9">Playwright journeys + UX audit</text>
  <text x="160" y="240" text-anchor="middle" fill="#e2e8f0" font-size="9">Core Web Vitals scan</text>
  <text x="160" y="256" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="600">fixes bugs inline</text>

  <!-- Arrow: simulate → build -->
  <line x1="260" y1="225" x2="298" y2="225" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="280" y="218" text-anchor="middle" fill="#64748b" font-size="8">[Arch]</text>

  <!-- Build -->
  <rect x="305" y="185" width="200" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="405" y="210" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">/vb-build</text>
  <text x="405" y="226" text-anchor="middle" fill="#e2e8f0" font-size="9">1 approval, then autonomous</text>
  <text x="405" y="240" text-anchor="middle" fill="#e2e8f0" font-size="9">implement + verify + commit</text>
  <text x="405" y="256" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">--daemon for continuous</text>

  <!-- Arrow: build → launch -->
  <line x1="505" y1="225" x2="543" y2="225" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Launch -->
  <rect x="550" y="185" width="190" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="645" y="210" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">/vb-launch</text>
  <text x="645" y="226" text-anchor="middle" fill="#e2e8f0" font-size="9">quality gates check</text>
  <text x="645" y="240" text-anchor="middle" fill="#e2e8f0" font-size="9">release notes + GitHub release</text>
  <text x="645" y="256" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="600">develop → main</text>
  <rect x="556" y="189" width="32" height="14" rx="3" fill="#10b981" opacity="0.15"/>
  <text x="572" y="199" text-anchor="middle" fill="#6ee7b7" font-size="7" font-weight="600">SHIP</text>

  <!-- Loop-back arrow: build → simulate (below the boxes) -->
  <path d="M 405 265 L 405 276 L 160 276 L 160 265" stroke="#818cf8" stroke-width="1" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)"/>

  <!-- ═══════════ ROW 4: SUPPORTING COMMANDS ═══════════ -->
  <text x="60" y="315" fill="#64748b" font-size="10" font-weight="600" letter-spacing="1">SUPPORTING COMMANDS</text>

  <!-- Review -->
  <rect x="60" y="330" width="210" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="165" y="352" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">/vb-review</text>
  <text x="165" y="368" text-anchor="middle" fill="#94a3b8" font-size="9">security + quality + a11y + --test</text>
  <text x="165" y="380" text-anchor="middle" fill="#64748b" font-size="8">OWASP Top 10, WCAG, test generation</text>

  <!-- Pitch -->
  <rect x="295" y="330" width="210" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="352" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">/vb-pitch</text>
  <text x="400" y="368" text-anchor="middle" fill="#94a3b8" font-size="9">--status / --metrics / --sales / --dev</text>
  <text x="400" y="380" text-anchor="middle" fill="#64748b" font-size="8">analytics + all GTM docs</text>

  <!-- ═══════════ ROW 5: GITHUB OUTPUT ═══════════ -->
  <text x="60" y="420" fill="#64748b" font-size="10" font-weight="600" letter-spacing="1">GITHUB — EVERYTHING AUTOMATIC</text>

  <rect x="60" y="434" width="680" height="68" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Row 1: Issues -->
  <circle cx="82" cy="453" r="8" fill="#30363d"/>
  <text x="82" y="457" text-anchor="middle" fill="#f0f6fc" font-size="9" font-weight="700">G</text>
  <text x="98" y="456" fill="#f0f6fc" font-size="10" font-weight="600">Issues</text>
  <text x="150" y="456" fill="#8b949e" font-size="9">[Bug] closed w/ SHA</text>
  <text x="290" y="456" fill="#8b949e" font-size="9">[Arch] open for /vb-build</text>
  <text x="448" y="456" fill="#8b949e" font-size="9">[Sim] Cycle N parent</text>

  <!-- Divider -->
  <line x1="72" y1="466" x2="728" y2="466" stroke="#21262d" stroke-width="1"/>

  <!-- Row 2: Board + Milestones -->
  <text x="82" y="482" fill="#f0f6fc" font-size="10" font-weight="600">Board</text>
  <rect x="118" y="472" width="62" height="18" rx="4" fill="#1f6feb" opacity="0.25"/>
  <text x="149" y="484" text-anchor="middle" fill="#58a6ff" font-size="8">Sim Queue</text>
  <rect x="186" y="472" width="72" height="18" rx="4" fill="#e3b341" opacity="0.18"/>
  <text x="222" y="484" text-anchor="middle" fill="#e3b341" font-size="8">Arch Backlog</text>
  <rect x="264" y="472" width="40" height="18" rx="4" fill="#3fb950" opacity="0.18"/>
  <text x="284" y="484" text-anchor="middle" fill="#3fb950" font-size="8">Done</text>

  <text x="330" y="482" fill="#30363d" font-size="10">|</text>

  <text x="348" y="482" fill="#f0f6fc" font-size="10" font-weight="600">Milestones</text>
  <text x="425" y="482" fill="#8b949e" font-size="9">v0.1 → v0.2 → ...</text>

  <text x="510" y="482" fill="#30363d" font-size="10">|</text>

  <text x="528" y="482" fill="#f0f6fc" font-size="10" font-weight="600">CI</text>
  <text x="546" y="482" fill="#8b949e" font-size="9">on every push</text>

  <text x="630" y="482" fill="#30363d" font-size="10">|</text>

  <text x="648" y="482" fill="#f0f6fc" font-size="10" font-weight="600">14 Labels</text>

  <!-- Divider -->
  <line x1="72" y1="492" x2="728" y2="492" stroke="#21262d" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="82" y="498" fill="#8b949e" font-size="8">Highlights Index (pinned issue) — Session digests (secret gists, private repos) — Release notes</text>

  <!-- ═══════════ ROW 6: YOUR APP ═══════════ -->
  <rect x="60" y="520" width="680" height="36" rx="8" fill="#1a1a2e" stroke="#334155" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="400" y="541" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">YOUR WEB APP</text>
  <text x="400" y="552" text-anchor="middle" fill="#475569" font-size="8">Next.js / React / Django / Rails / Laravel — localhost via Playwright (npx, no MCP)</text>

  <!-- ═══════════ VERTICAL FLOW ARROWS (left margin, clean) ═══════════ -->
  <!-- Core loop → GitHub -->
  <path d="M 160 265 L 160 296 L 82 296 L 82 330" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#arr-green)"/>
  <path d="M 405 265 L 405 296 L 400 296 L 400 330" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="4,3" fill="none"/>

  <!-- Commands → GitHub (all output to GH) -->
  <path d="M 165 386 L 165 400 L 100 400 L 100 434" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#arr-green)"/>

  <!-- Simulate/Build ↔ Your App (Playwright) -->
  <line x1="200" y1="504" x2="200" y2="520" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="215" y="515" fill="#818cf8" font-size="7">Playwright</text>

  <!-- ═══════════ ZYSEC LOGO ═══════════ -->
  <g transform="translate(685, 558)">
    <path d="M10 1 L18 4 L18 9 C18 13 14.5 16.5 10 18 C5.5 16.5 2 13 2 9 L2 4 Z" fill="#6366f1" opacity="0.7"/>
    <path d="M7.5 9 L9.5 11 L13 7.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="22" y="12" fill="#64748b" font-size="9" font-weight="700">ZySec</text>
    <text x="56" y="12" fill="#475569" font-size="9" font-weight="300">AI</text>
  </g>

</svg>
